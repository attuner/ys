<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>PULSE SHORTS // LIVE FEED</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    :root {
      --bg-black: #000000;
      --yt-red: #FF0000;
      --text-white: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.75);
      --font-ui: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg-black);
      overflow: hidden;
      font-family: var(--font-ui);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Vertical Shorts 9:16 Phone Aspect Viewport */
    .shorts-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      max-width: 500px; /* Centered feed on desktop */
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Clean Video Viewport (No video controls) */
    .shorts-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000000;
      cursor: pointer;
    }

    .shorts-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
      display: none;
    }

    /* Animated Center Play/Pause Indicator */
    .center-state-icon {
      position: absolute;
      width: 72px;
      height: 72px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .center-state-icon.show {
      opacity: 1;
      transform: scale(1);
    }

    .center-state-icon svg {
      width: 36px;
      height: 36px;
      fill: #FFFFFF;
    }

    /* Double-Tap Heart Reaction */
    .floating-heart {
      position: absolute;
      width: 90px;
      height: 90px;
      fill: var(--yt-red);
      z-index: 25;
      pointer-events: none;
      transform: scale(0);
      animation: heartPop 0.8s ease-out forwards;
    }

    @keyframes heartPop {
      0% { transform: scale(0) rotate(-15deg); opacity: 0; }
      40% { transform: scale(1.2) rotate(0deg); opacity: 1; }
      80% { transform: scale(1) translateY(-30px); opacity: 0.8; }
      100% { transform: scale(0.9) translateY(-60px); opacity: 0; }
    }

    /* Right Action Bar (Likes, Dislikes, Comments, Share, Audio Disc) */
    .shorts-action-bar {
      position: absolute;
      right: 12px;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 20;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .action-icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }

    .action-btn:active .action-icon-circle {
      transform: scale(0.88);
    }

    .action-btn svg {
      width: 26px;
      height: 26px;
      fill: #FFFFFF;
    }

    .action-btn.active-action svg {
      fill: var(--yt-red);
    }

    .action-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #FFFFFF;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .sound-disc {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1a1a1a;
      border: 2px solid #555;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinDisc 4s linear infinite;
    }

    @keyframes spinDisc {
      100% { transform: rotate(360deg); }
    }

    /* Bottom Left Shorts Creator Info */
    .shorts-bottom-meta {
      position: absolute;
      left: 14px;
      right: 76px;
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .author-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .author-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--yt-red), #FF6600);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.85rem;
      border: 1.5px solid #FFFFFF;
    }

    .author-handle {
      font-weight: 700;
      font-size: 0.92rem;
      color: #FFFFFF;
    }

    .subscribe-tag {
      background: #FFFFFF;
      color: #000000;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      margin-left: 4px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .subscribe-tag.subscribed {
      background: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
    }

    .shorts-description {
      font-size: 0.88rem;
      line-height: 1.35;
      font-weight: 500;
      color: #FFFFFF;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Only Control Displayed: Slim Bottom Progress Line */
    .timeline-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      z-index: 30;
    }

    .timeline-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--yt-red);
      transition: width 0.15s linear;
    }

    /* Sliding Comments Drawer */
    .comments-drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65%;
      background: #181818;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.8);
    }

    .comments-drawer.open {
      transform: translateY(0);
    }

    .comments-header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .close-comments-btn {
      background: transparent;
      border: none;
      color: #FFF;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .comments-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment-card {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.82rem;
    }

    .comment-card .author {
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .comment-card .text {
      color: #FFFFFF;
      line-height: 1.3;
    }

    .comment-input-wrap {
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom, 0px)) 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 8px;
    }

    .comment-input-wrap input {
      flex: 1;
      background: #282828;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 8px 14px;
      color: #FFF;
      font-size: 0.85rem;
      outline: none;
    }

    .comment-input-wrap button {
      background: var(--yt-red);
      border: none;
      color: #FFF;
      border-radius: 999px;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Shorts Vertical Screen Container -->
  <div class="shorts-container" id="shortsContainer">

    <!-- Center Play/Pause Icon -->
    <div id="centerStateIcon" class="center-state-icon">
      <svg id="stateSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>

    <!-- Active Native Video Player (Controls Removed) -->
    <video
      id="shortsVideoPlayer"
      class="shorts-video"
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <!-- Embedded Fallback Player -->
    <iframe id="embedPlayer" class="shorts-iframe" allow="autoplay; fullscreen"></iframe>

    <!-- Right Side Engagement Bar: Synced 100% with Google Sheets -->
    <div class="shorts-action-bar">
      <button class="action-btn" id="likeBtn" onclick="handleLikeClick(event)">
        <div class="action-icon-circle">
          <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
        </div>
        <span class="action-label" id="likeCount">0</span>
      </button>

      <button class="action-btn" id="dislikeBtn" onclick="handleDislikeClick(event)">
        <div class="action-icon-circle">
          <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
        </div>
        <span class="action-label" id="dislikeCount">Dislike</span>
      </button>

      <button class="action-btn" onclick="openCommentsDrawer(event)">
        <div class="action-icon-circle">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
        </div>
        <span class="action-label" id="commentCount">0</span>
      </button>

      <button class="action-btn" onclick="shareShort(event)">
        <div class="action-icon-circle">
          <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
        </div>
        <span class="action-label">Share</span>
      </button>

      <div class="sound-disc">
        <svg style="width:18px;height:18px;fill:#FFF;" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
    </div>

    <!-- Bottom Left Channel Metadata & Subscription -->
    <div class="shorts-bottom-meta">
      <div class="author-pill">
        <div class="author-avatar" id="authorInitial">P</div>
        <span class="author-handle" id="authorHandle">@channel</span>
        <button id="subBtn" class="subscribe-tag" onclick="handleSubscribeClick(event)">Subscribe</button>
      </div>
      <div class="shorts-description" id="shortTitle">Loading Shorts...</div>
    </div>

    <!-- Only Visible Video Control: Slim Progress Line -->
    <div class="timeline-progress">
      <div id="timelineProgressFill" class="timeline-progress-fill"></div>
    </div>

    <!-- Slide-up Interactive Comments Drawer -->
    <div id="commentsDrawer" class="comments-drawer">
      <div class="comments-header">
        <span>Comments</span>
        <button class="close-comments-btn" onclick="closeCommentsDrawer()">&times;</button>
      </div>
      <div id="commentsList" class="comments-list"></div>
      <div class="comment-input-wrap">
        <input type="text" id="commentInput" placeholder="Add a comment..." maxlength="200" onkeydown="if(event.key==='Enter')postComment()">
        <button onclick="postComment()">Post</button>
      </div>
    </div>

  </div>

  <script>
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbw5SRk0W7-aOA20VB5oxGRagNi8ZuATPicdX65pDBQFjA5pbtYI01lmTXNUUGKL7sqc/exec";
    const POLL_INTERVAL = 15000;

    let currentQueue = [];
    let currentTrackIndex = 0;
    let pollTimerId = null;
    let isDrawerOpen = false;

    // Persistent Unique Viewer Identity for 100% Sheet Sync
    let viewerSessionId = localStorage.getItem("PULSE_SHORTS_VIEWER_ID");
    if (!viewerSessionId) {
      viewerSessionId = "usr_" + Math.random().toString(36).substring(2, 12);
      localStorage.setItem("PULSE_SHORTS_VIEWER_ID", viewerSessionId);
    }

    // Gesture & Touch Coordinates for Vertical Up/Down Navigation
    let touchStartY = 0;
    let touchEndY = 0;
    let lastTapTime = 0;

    const videoPlayer = document.getElementById("shortsVideoPlayer");
    const embedPlayer = document.getElementById("embedPlayer");
    const container = document.getElementById("shortsContainer");
    const centerIcon = document.getElementById("centerStateIcon");
    const stateSvg = document.getElementById("stateSvg");
    const progressBar = document.getElementById("timelineProgressFill");
    const authorHandle = document.getElementById("authorHandle");
    const authorInitial = document.getElementById("authorInitial");
    const shortTitle = document.getElementById("shortTitle");
    const subBtn = document.getElementById("subBtn");
    const likeBtn = document.getElementById("likeBtn");
    const dislikeBtn = document.getElementById("dislikeBtn");
    const likeCount = document.getElementById("likeCount");
    const commentCount = document.getElementById("commentCount");
    const commentsDrawer = document.getElementById("commentsDrawer");
    const commentsList = document.getElementById("commentsList");
    const commentInput = document.getElementById("commentInput");

    window.addEventListener("DOMContentLoaded", () => {
      initPlayerEvents();
      initVerticalSwipeNavigation();

      // Immediate Unmuted Auto-Play Resolution: starts playing automatically without buttons
      fetchLiveShortsFeed();
      pollTimerId = setInterval(fetchLiveShortsFeed, POLL_INTERVAL);

      // Dynamically unmute on first background screen interaction
      document.body.addEventListener("pointerdown", () => {
        if (videoPlayer.muted) {
          videoPlayer.muted = false;
        }
      }, { once: true });
    });

    function initPlayerEvents() {
      // Linear Progress Line Sync
      videoPlayer.addEventListener("timeupdate", () => {
        if (!videoPlayer.duration || !isFinite(videoPlayer.duration)) return;
        const pct = (videoPlayer.currentTime / videoPlayer.duration) * 100;
        progressBar.style.width = pct + "%";
      });

      // Loop current video as YouTube Shorts or auto-advance
      videoPlayer.addEventListener("ended", () => {
        advanceShort(1);
      });

      videoPlayer.addEventListener("error", () => {
        const track = currentQueue[currentTrackIndex];
        if (track && track.fileId) {
          videoPlayer.style.display = "none";
          embedPlayer.style.display = "block";
          embedPlayer.src = `https://drive.google.com/file/d/${encodeURIComponent(track.fileId)}/preview`;
        } else {
          advanceShort(1);
        }
      });
    }

    /**
     * Vertical Up / Down Swipe & Scroll Navigation (Exactly like YouTube Shorts)
     */
    function initVerticalSwipeNavigation() {
      container.addEventListener("touchstart", (e) => {
        if (isDrawerOpen) return;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      container.addEventListener("touchend", (e) => {
        if (isDrawerOpen) return;
        touchEndY = e.changedTouches[0].screenY;
        const deltaY = touchStartY - touchEndY;
        if (deltaY > 50) {
          advanceShort(1); // Swiped UP -> Next Short
        } else if (deltaY < -50) {
          advanceShort(-1); // Swiped DOWN -> Previous Short
        }
      }, { passive: true });

      // Desktop Wheel Scroll (Scroll down for next, scroll up for previous)
      let wheelThrottle = false;
      window.addEventListener("wheel", (e) => {
        if (wheelThrottle || isDrawerOpen) return;
        wheelThrottle = true;
        setTimeout(() => wheelThrottle = false, 650);

        if (e.deltaY > 20) {
          advanceShort(1);
        } else if (e.deltaY < -20) {
          advanceShort(-1);
        }
      }, { passive: true });

      // Keyboard Shortcuts: Up/Down Arrows and Spacebar
      window.addEventListener("keydown", (e) => {
        if (isDrawerOpen) return;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          advanceShort(1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          advanceShort(-1);
        } else if (e.key === " " || e.key === "k" || e.key === "K") {
          e.preventDefault();
          togglePlayPause();
        }
      });

      // Tap on Video: Toggle Play/Pause or Double-Tap Heart
      videoPlayer.addEventListener("click", (e) => {
        if (isDrawerOpen) {
          closeCommentsDrawer();
          return;
        }

        const currentTime = new Date().getTime();
        const tapGap = currentTime - lastTapTime;

        if (tapGap < 300 && tapGap > 0) {
          spawnDoubleTapHeart(e.clientX, e.clientY);
          if (!likeBtn.classList.contains("active-action")) {
            handleLikeClick();
          }
        } else {
          togglePlayPause();
        }
        lastTapTime = currentTime;
      });
    }

    function advanceShort(direction) {
      if (currentQueue.length === 0) return;

      currentTrackIndex += direction;

      // Infinite loop sequence: Latest to Oldest, then resets back to Latest
      if (currentTrackIndex >= currentQueue.length) {
        currentTrackIndex = 0;
      } else if (currentTrackIndex < 0) {
        currentTrackIndex = currentQueue.length - 1;
      }

      playShort(currentQueue[currentTrackIndex]);
    }

    function playShort(track) {
      if (!track) return;

      // Update Channel Metadata & Verification
      const handle = track.uploaderUsername ? `@${track.uploaderUsername}` : "@creator";
      authorHandle.textContent = handle;
      authorInitial.textContent = handle.replace("@", "").charAt(0).toUpperCase();
      shortTitle.textContent = track.title || track.fileName || "Pulse Short";

      // Render Synchronized Sheet Counters
      likeCount.textContent = formatMetric(track.likesCount || 0);
      commentCount.textContent = formatMetric(track.commentsCount || 0);

      // Synchronize Like / Dislike Active States
      likeBtn.classList.toggle("active-action", track.userInteraction === "LIKE");
      dislikeBtn.classList.toggle("active-action", track.userInteraction === "DISLIKE");

      // Synchronize Subscription State
      if (track.isSubscribed) {
        subBtn.textContent = "Subscribed";
        subBtn.classList.add("subscribed");
      } else {
        subBtn.textContent = "Subscribe";
        subBtn.classList.remove("subscribed");
      }

      // Reset Players
      embedPlayer.style.display = "none";
      embedPlayer.src = "";
      videoPlayer.style.display = "block";

      videoPlayer.pause();
      videoPlayer.src = `https://drive.google.com/uc?export=download&id=${encodeURIComponent(track.fileId)}`;
      videoPlayer.load();

      // Autoplay without user clicks
      const playPromise = videoPlayer.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // If browser policy rejects unmuted autoplay, start muted immediately without waiting
          videoPlayer.muted = true;
          videoPlayer.play().catch(() => {
            videoPlayer.style.display = "none";
            embedPlayer.style.display = "block";
            embedPlayer.src = `https://drive.google.com/file/d/${encodeURIComponent(track.fileId)}/preview`;
          });
        });
      }
    }

    function togglePlayPause() {
      if (videoPlayer.paused) {
        videoPlayer.play().then(() => showCenterIcon(false)).catch(() => {});
      } else {
        videoPlayer.pause();
        showCenterIcon(true);
      }
    }

    function showCenterIcon(isPaused) {
      stateSvg.innerHTML = isPaused
        ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
      centerIcon.classList.add("show");
      setTimeout(() => centerIcon.classList.remove("show"), 500);
    }

    /**
     * 100% Accurate Google Sheets Sync: Likes
     */
    async function handleLikeClick(e) {
      if (e) e.stopPropagation();
      const track = currentQueue[currentTrackIndex];
      if (!track) return;

      const isCurrentlyLiked = likeBtn.classList.contains("active-action");
      likeBtn.classList.toggle("active-action", !isCurrentlyLiked);
      dislikeBtn.classList.remove("active-action");

      // Optimistic update
      let count = parseInt(track.likesCount, 10) || 0;
      count = isCurrentlyLiked ? Math.max(0, count - 1) : count + 1;
      track.likesCount = count;
      likeCount.textContent = formatMetric(count);

      try {
        const resp = await executeGasRequest({
          action: "toggleInteraction",
          viewerId: viewerSessionId,
          contentId: track.contentId,
          type: "LIKE"
        });

        if (resp.success && resp.data) {
          track.likesCount = resp.data.likes;
          likeCount.textContent = formatMetric(resp.data.likes);
          likeBtn.classList.toggle("active-action", resp.data.userStatus === "LIKE");
        }
      } catch (err) {
        console.warn("Like sync notice:", err);
      }
    }

    /**
     * 100% Accurate Google Sheets Sync: Dislikes
     */
    async function handleDislikeClick(e) {
      if (e) e.stopPropagation();
      const track = currentQueue[currentTrackIndex];
      if (!track) return;

      const isCurrentlyDisliked = dislikeBtn.classList.contains("active-action");
      dislikeBtn.classList.toggle("active-action", !isCurrentlyDisliked);
      likeBtn.classList.remove("active-action");

      try {
        const resp = await executeGasRequest({
          action: "toggleInteraction",
          viewerId: viewerSessionId,
          contentId: track.contentId,
          type: "DISLIKE"
        });

        if (resp.success && resp.data) {
          track.likesCount = resp.data.likes;
          likeCount.textContent = formatMetric(resp.data.likes);
          dislikeBtn.classList.toggle("active-action", resp.data.userStatus === "DISLIKE");
        }
      } catch (err) {
        console.warn("Dislike sync notice:", err);
      }
    }

    /**
     * 100% Accurate Google Sheets Sync: Subscriptions
     */
    async function handleSubscribeClick(e) {
      if (e) e.stopPropagation();
      const track = currentQueue[currentTrackIndex];
      if (!track || !track.uploaderUsername) return;

      const isSubbed = subBtn.classList.contains("subscribed");
      subBtn.classList.toggle("subscribed", !isSubbed);
      subBtn.textContent = !isSubbed ? "Subscribed" : "Subscribe";

      try {
        const resp = await executeGasRequest({
          action: "toggleSubscription",
          viewerId: viewerSessionId,
          channelUsername: track.uploaderUsername
        });

        if (resp.success && resp.data) {
          track.isSubscribed = resp.data.isSubscribed;
          subBtn.textContent = resp.data.isSubscribed ? "Subscribed" : "Subscribe";
          subBtn.classList.toggle("subscribed", resp.data.isSubscribed);
        }
      } catch (err) {
        console.warn("Subscription sync notice:", err);
      }
    }

    /**
     * Comments Drawer & Google Sheets Sync
     */
    async function openCommentsDrawer(e) {
      if (e) e.stopPropagation();
      isDrawerOpen = true;
      commentsDrawer.classList.add("open");
      commentsList.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:0.8rem;padding:20px;">Loading comments...</div>`;

      const track = currentQueue[currentTrackIndex];
      if (!track) return;

      try {
        const resp = await executeGasRequest({
          action: "getComments",
          contentId: track.contentId
        }, "GET");

        if (resp.success && resp.data && resp.data.comments) {
          renderComments(resp.data.comments);
        }
      } catch (err) {
        commentsList.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:0.8rem;padding:20px;">No comments yet. Be the first!</div>`;
      }
    }

    function closeCommentsDrawer() {
      isDrawerOpen = false;
      commentsDrawer.classList.remove("open");
    }

    function renderComments(comments) {
      if (!comments || comments.length === 0) {
        commentsList.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:0.8rem;padding:20px;">No comments yet. Say something!</div>`;
        return;
      }

      commentsList.innerHTML = "";
      comments.forEach(c => {
        const div = document.createElement("div");
        div.className = "comment-card";
        div.innerHTML = `
          <span class="author">@${c.authorName}</span>
          <span class="text">${escapeHtml(c.text)}</span>
        `;
        commentsList.appendChild(div);
      });
    }

    async function postComment() {
      const text = commentInput.value.trim();
      if (!text) return;

      const track = currentQueue[currentTrackIndex];
      if (!track) return;

      commentInput.value = "";

      try {
        const resp = await executeGasRequest({
          action: "addComment",
          contentId: track.contentId,
          authorName: "viewer_" + viewerSessionId.substring(4, 8),
          commentText: text
        });

        if (resp.success && resp.data) {
          track.commentsCount = resp.data.totalComments;
          commentCount.textContent = formatMetric(resp.data.totalComments);

          const div = document.createElement("div");
          div.className = "comment-card";
          div.innerHTML = `
            <span class="author">@${resp.data.authorName}</span>
            <span class="text">${escapeHtml(resp.data.commentText)}</span>
          `;
          if (commentsList.firstChild && commentsList.firstChild.textContent.includes("No comments")) {
            commentsList.innerHTML = "";
          }
          commentsList.appendChild(div);
          commentsList.scrollTop = commentsList.scrollHeight;
        }
      } catch (err) {
        console.warn("Failed to post comment:", err);
      }
    }

    function shareShort(e) {
      if (e) e.stopPropagation();
      if (navigator.share) {
        navigator.share({
          title: shortTitle.textContent,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
      }
    }

    function spawnDoubleTapHeart(x, y) {
      const heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      heart.setAttribute("viewBox", "0 0 24 24");
      heart.classList.add("floating-heart");
      heart.innerHTML = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';

      const rect = container.getBoundingClientRect();
      heart.style.left = (x - rect.left - 45) + "px";
      heart.style.top = (y - rect.top - 45) + "px";

      container.appendChild(heart);
      setTimeout(() => heart.remove(), 800);
    }

    async function fetchLiveShortsFeed() {
      try {
        let endpoint = `${GAS_ENDPOINT_URL}?action=getShortsFeed&viewerId=${encodeURIComponent(viewerSessionId)}`;
        const res = await fetch(endpoint, { method: "GET", mode: "cors" });
        const json = await res.json();

        if (json.success && json.data && json.data.manifest && json.data.manifest.length > 0) {
          const incoming = json.data.manifest;

          if (currentQueue.length === 0) {
            currentQueue = incoming;
            currentTrackIndex = 0;
            playShort(currentQueue[0]);
            return;
          }

          const activeId = currentQueue[currentTrackIndex]?.contentId;
          currentQueue = incoming;

          if (activeId) {
            const remapped = currentQueue.findIndex(v => v.contentId === activeId);
            if (remapped !== -1) currentTrackIndex = remapped;
          }
        }
      } catch (err) {
        console.warn("Feed poll notice:", err);
      }
    }

    function formatMetric(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + "M";
      if (num >= 1000) return (num / 1000).toFixed(1) + "K";
      return num.toString();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    async function executeGasRequest(data, method = "POST") {
      let url = GAS_ENDPOINT_URL;
      let options = { method: method, mode: "cors" };

      if (method === "GET") {
        const params = new URLSearchParams(data).toString();
        url += (url.includes("?") ? "&" : "?") + params;
      } else {
        options.headers = { "Content-Type": "text/plain;charset=utf-8" };
        options.body = JSON.stringify(data);
      }

      const res = await fetch(url, options);
      return await res.json();
    }
  </script>
